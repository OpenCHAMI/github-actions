name: 'Verify gpg trust chain'
author: 'OpenCHAMI'
branding: { icon: 'shield', color: 'purple' }
description: >-
  Verifies the release trust chain (offline org master certifies the repo-cert
  key, which certifies the per-run signing key) and each file's detached
  signature by the signing key. Format-agnostic: verifies files such as
  checksums.txt, not packages.

inputs:
  public-key-master:
    description: 'ASCII-armored org master public key (e.g. the MASTER_PUBLIC_ASC org secret); never the copy attached to a release'
    required: true
  fingerprint-master:
    description: 'Full fingerprint of the org master key (e.g. the MASTER_FPR org secret); the master public key must match it'
    required: true
  public-key-file-repo:
    description: 'Repo-cert public key, certified by the master'
    required: false
    default: 'pubkey-repo.asc'
  public-key-file-signing:
    description: 'Per-run signing public key, certified by the repo-cert key'
    required: false
    default: 'pubkey-signing.asc'
  files:
    description: 'Space- or newline-separated files to verify; each needs a detached signature at <file>.asc'
    required: false
    default: 'checksums.txt'
  repo:
    description: 'Expected owner/repo (e.g. OpenCHAMI/smd); when set, the master must have certified the repo-cert user ID "<owner>/<repo> RPM Signing Key"'
    required: false
    default: ''

outputs:
  fingerprint-master:
    description: 'Fingerprint of the org master key'
    value: ${{ steps.verify.outputs.fingerprint-master }}
  fingerprint-repo:
    description: 'Fingerprint of the repo-cert key'
    value: ${{ steps.verify.outputs.fingerprint-repo }}
  fingerprint-signing:
    description: 'Fingerprint of the per-run signing key'
    value: ${{ steps.verify.outputs.fingerprint-signing }}

runs:
  using: composite
  steps:
    - name: Install GnuPG
      shell: bash
      run: |
        set -euo pipefail
        command -v gpg >/dev/null 2>&1 && exit 0
        SUDO=''; command -v sudo >/dev/null 2>&1 && SUDO=sudo
        if command -v apt-get >/dev/null 2>&1; then
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq --no-install-recommends gnupg
        elif command -v dnf >/dev/null 2>&1; then
          $SUDO dnf install -y -q gnupg2
        else
          echo '::error::Unsupported package manager: need apt-get or dnf'
          exit 1
        fi

    - name: Verify trust chain and signatures
      id: verify
      shell: bash
      env:
        MASTER_PUBLIC_KEY: ${{ inputs.public-key-master }}
        MASTER_FINGERPRINT: ${{ inputs.fingerprint-master }}
        REPO_KEY_FILE: ${{ inputs.public-key-file-repo }}
        SIGNING_KEY_FILE: ${{ inputs.public-key-file-signing }}
        FILES: ${{ inputs.files }}
        REPO: ${{ inputs.repo }}
      # The checks live in scripts/ so they can also run outside Actions.
      run: OUTPUT_FILE="$GITHUB_OUTPUT" "$GITHUB_ACTION_PATH/../../scripts/gpg-verify-trust-chain.sh"

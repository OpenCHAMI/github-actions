name: 'Discover GHCR images'
author: 'OpenCHAMI'
branding: { icon: 'search', color: 'blue' }
description: 'Finds and verifies the GHCR package names for a repository'

inputs:
  images:
    description: 'Space- or newline-separated GHCR package names (overrides discovery)'
    required: false
    default: ''

outputs:
  names:
    description: 'Space-separated GHCR package names (without registry or owner)'
    value: ${{ steps.verify.outputs.names }}
  source:
    description: 'Where the names came from: input, goreleaser, or repo'
    value: ${{ steps.source.outputs.source }}

runs:
  using: composite
  steps:
    - name: Select image source
      id: source
      shell: bash
      env:
        IMAGES: ${{ inputs.images }}
      run: |
        set -euo pipefail
        config=""
        # Same lookup order as GoReleaser itself.
        for f in .config/goreleaser.yml .config/goreleaser.yaml .goreleaser.yml .goreleaser.yaml goreleaser.yml goreleaser.yaml; do
          [[ -f "$f" ]] && { config=$f; break; }
        done
        if [[ -n "$IMAGES" ]]; then
          source=input
        elif [[ -n "$config" ]] && grep -q '^dockers_v2:' "$config"; then
          source=goreleaser
        else
          source=repo
        fi
        echo "Image names from: ${source}"
        {
          echo "source=${source}"
          echo "config=${config}"
        } >> "$GITHUB_OUTPUT"

    - name: Read image names from input
      id: input
      if: ${{ steps.source.outputs.source == 'input' }}
      shell: bash
      env:
        IMAGES: ${{ inputs.images }}
      run: echo "names=$(xargs <<< "$IMAGES")" >> "$GITHUB_OUTPUT"

    - name: Read image names from GoReleaser config
      id: goreleaser
      if: ${{ steps.source.outputs.source == 'goreleaser' }}
      shell: bash
      env:
        CONFIG: ${{ steps.source.outputs.config }}
      run: |
        set -euo pipefail
        names=$(yq -r '.dockers_v2[].images[] | select(test("^ghcr\\.io/")) | sub("^ghcr\\.io/[^/]+/"; "")' "$CONFIG" | xargs)
        if [[ -z "$names" ]]; then
          echo "::error::No ghcr.io images in ${CONFIG} dockers_v2. Set the images input."
          exit 1
        fi
        if [[ "$names" == *"{{"* ]]; then
          echo "::error::Templated image names in ${CONFIG} can't be resolved. Set the images input."
          exit 1
        fi
        echo "names=${names}" >> "$GITHUB_OUTPUT"

    - name: Guess image name from repository
      id: repo
      if: ${{ steps.source.outputs.source == 'repo' }}
      shell: bash
      env:
        REPO_NAME: ${{ github.event.repository.name }}
      run: echo "names=${REPO_NAME,,}" >> "$GITHUB_OUTPUT"

    - name: Check packages exist
      id: verify
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        OWNER: ${{ github.repository_owner }}
        SOURCE: ${{ steps.source.outputs.source }}
        NAMES: ${{ steps.input.outputs.names || steps.goreleaser.outputs.names || steps.repo.outputs.names }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086 # intentional word splitting
        names=$(printf '%s\n' $NAMES | sort -u | xargs)
        failed=false
        for package in $names; do
          # Nested package names (tools/foo) need their slash encoded.
          encoded=$(jq -rn --arg name "$package" '$name | @uri')
          if ! gh api "/orgs/${OWNER}/packages/container/${encoded}" --silent; then
            echo "::error::No ghcr.io package '${package}' (name from ${SOURCE}). Set the images input to the right package names."
            failed=true
          fi
        done
        [[ "$failed" == false ]] || exit 1
        echo "names=${names}" >> "$GITHUB_OUTPUT"

name: 'configure gpg release keys for downstream tasks'
author: 'OpenCHAMI'
branding:
  icon: 'lock'
  color: 'purple'
description: 'Creates an ephemeral GPG key per build and certifies it with a repo-scoped certification key'

inputs:
  repo-cert-key-armored-b64:
    required: true
    description: 'Base64-encoded ASCII-armored repo certification secret key used to certify the ephemeral key'
  master-public-key-asc:
    required: true
    description: 'ASCII-armored public key for the offline master key that certified the repo certification key'
  master-fpr:
    required: true
    description: 'Full fingerprint of the offline master key'
  name:
    description: 'Name (real) for the ephemeral key'
    default: 'Ephemeral Key'
  comment:
    description: 'Additional comment / metadata (will have a random suffix appended)'
    default: ''
  email:
    description: 'Email for the ephemeral key'
    default: 'ci@build.local'
  key-length:
    description: 'RSA key length'
    default: '4096'
  expire-days:
    description: 'Expiration in days for the ephemeral key'
    default: '1'

outputs:
  # keep private cryptographical info on disk; avoid leaking it out to logs
  gnupg-home:
    description: 'Path to isolated GNUPGHOME for subsequent actions'
    value: ${{ steps.setup.outputs.gnupghome }}

  # directly export public key cryptography data to simplify downstream ops
  ephemeral-fingerprint:
    description: 'Fingerprint of the generated ephemeral key'
    value: ${{ steps.export.outputs.ephemeral-fingerprint }}
  ephemeral-public-key-b64:
    description: 'Base64 of ASCII-armored ephemeral public key'
    value: ${{ steps.export.outputs.ephemeral-public-b64 }}
  ephemeral-public-key-file:
    description: 'Path to ASCII-armored ephemeral public key file'
    value: ${{ steps.export.outputs.ephemeral-public-file }}
  repo-cert-fingerprint:
    description: 'Fingerprint of the repo-cert key'
    value: ${{ steps.export.outputs.repo-cert-fingerprint }}
  repo-cert-public-key-b64:
    description: 'Base64 of ASCII-armored repo certification public key (primary only)'
    value: ${{ steps.export.outputs.repo-cert-public-b64 }}
  repo-cert-public-key-file:
    description: 'Path to ASCII-armored repo-cert public key file'
    value: ${{ steps.export.outputs.repo-cert-public-file }}
  master-fingerprint:
    description: 'Fingerprint of the master key'
    value: ${{ steps.export.outputs.master-fingerprint }}
  master-public-key-b64:
    description: 'Base64 of ASCII-armored master public key (primary only)'
    value: ${{ steps.export.outputs.master-public-b64 }}
  master-public-key-file:
    description: 'Path to ASCII-armored master public key file'
    value: ${{ steps.export.outputs.master-public-file }}

runs:
  using: "composite"
  steps:
    - id: setup
      shell: bash
      run: |
        set -euo pipefail

        GNUPGHOME="$(mktemp -d)"
        chmod 700 "$GNUPGHOME"
        echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
        echo "gnupghome=$GNUPGHOME" >> "$GITHUB_OUTPUT"

        command -v gpg >/dev/null 2>&1 && exit 0
        SUDO=''; command -v sudo >/dev/null 2>&1 && SUDO=sudo
        if command -v apt-get >/dev/null 2>&1; then
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq --no-install-recommends gnupg
        elif command -v dnf >/dev/null 2>&1; then
          $SUDO dnf install -y -q gnupg2
        else
          echo '::error::Unsupported package manager: need apt-get or dnf'
          exit 1
        fi

    - id: import
      shell: bash
      run: |
        set -euo pipefail
        echo "Importing repo certification key..."

        # Decode repo certification key
        decoded=$(echo "${{ inputs.repo-cert-key-armored-b64 }}" | base64 -d 2>/dev/null || true)
        if [[ -z "$decoded" ]]; then
          echo "ERROR: repo-cert-key-armored-b64 is invalid or empty!" >&2
          exit 1
        fi

        # Import key
        gpg --batch --import <(echo "$decoded") || {
          echo "ERROR: Failed to import repo certification key" >&2
          exit 1
        }

        # List keys for debug
        echo "::group::GPG secret keys"
        gpg --list-secret-keys
        echo "::endgroup::"

        # Get repo_cert fingerprint
        repo_cert_fpr=$(gpg --batch --with-colons --list-secret-keys |  awk -F: '/^fpr:/ {print $10; exit}')
        if [[ -z "$repo_cert_fpr" ]]; then
          echo "ERROR: No secret key found after import" >&2
          exit 1
        fi

        echo "Using REPO_CERT_FPR=$repo_cert_fpr"
        echo "REPO_CERT_FPR=$repo_cert_fpr" >> "$GITHUB_ENV"

    - id: generate
      shell: bash
      run: |
        set -euo pipefail
        # Sanitize user inputs to avoid config injection
        safe_name=$(printf '%s' "${{ inputs.name }}" | tr -cd '[:alnum:] ._@-')
        safe_comment=$(printf '%s' "${{ inputs.comment }}" | tr -cd '[:alnum:] ._@:-')
        safe_email=$(printf '%s' "${{ inputs.email }}" | tr -cd '[:alnum:]@._-')
        marker=$(openssl rand -hex 6 2>/dev/null || date +%s)
        safe_comment="$safe_comment build-${GITHUB_RUN_ID:-0}-$marker"
        echo "MARKER=$marker" >> "$GITHUB_ENV"
        expire_days="${{ inputs.expire-days }}"
        key_length="${{ inputs.key-length }}"

        # No passphrase: key is ephemeral (short expiry, per expire-days
        # input), lives only in this run's isolated GNUPGHOME, and is
        # shredded on teardown.
        printf "%%no-protection\n" > keygen.conf
        printf "Key-Type: RSA\n" >> keygen.conf
        printf "Key-Length: %s\n" "$key_length" >> keygen.conf
        printf "Name-Real: %s\n" "$safe_name" >> keygen.conf
        printf "Name-Comment: %s\n" "$safe_comment" >> keygen.conf
        printf "Name-Email: %s\n" "$safe_email" >> keygen.conf
        printf "Expire-Date: %sd\n" "$expire_days" >> keygen.conf
        printf "Key-Usage: sign\n" >> keygen.conf
        printf "%%commit\n" >> keygen.conf

        gpg --batch --gen-key keygen.conf
        shred -u keygen.conf || rm -f keygen.conf

    - id: fpr
      shell: bash
      run: |
        set -euo pipefail
        echo "Available keys for debug:"
        gpg --list-keys

        ephemeral_fpr=$(gpg --with-colons --list-keys | awk -F: -v m="${MARKER:-}" '
          /^fpr:/ { fpr=$10 }
          /^uid:/ {
            if (index($10, m) > 0) {
              print fpr
              exit
            }
          }')

        if [ -z "$ephemeral_fpr" ]; then
          echo "Failed to locate ephemeral key fingerprint" >&2
          exit 1
        fi
        echo "EPHEMERAL_FPR=$ephemeral_fpr" >> "$GITHUB_ENV"

    - id: sign-ephemeral
      shell: bash
      run: |
        set -euo pipefail
        gpg --batch --yes --quick-sign-key --local-user "$REPO_CERT_FPR" "$EPHEMERAL_FPR"
        gpg --batch --yes --delete-secret-keys "$REPO_CERT_FPR"

    - id: export
      shell: bash
      env:
        MASTER_PUBLIC_KEY_ASC: ${{ inputs.master-public-key-asc }}
      run: |
        set -euo pipefail

        gpg --armor --export "$EPHEMERAL_FPR"  > "ephemeral.pub.asc"
        gpg --armor --export "${REPO_CERT_FPR}!"    > "repo-cert.pub.asc"
        printf '%s\n' "$MASTER_PUBLIC_KEY_ASC" > "master.pub.asc"

        for k in ephemeral repo-cert master; do
          test -s "$k.pub.asc" || { echo "ERROR: empty export for $k" >&2; exit 1; }
        done

        {
          echo "ephemeral-fingerprint=${EPHEMERAL_FPR}"
          echo "ephemeral-public-b64=$(base64 -w0 < "ephemeral.pub.asc")"
          echo "ephemeral-public-file=ephemeral.pub.asc"
          echo "repo-cert-fingerprint=${REPO_CERT_FPR}"
          echo "repo-cert-public-b64=$(base64 -w0 < "repo-cert.pub.asc")"
          echo "repo-cert-public-file=repo-cert.pub.asc"
          echo "master-fingerprint=${{ inputs.master-fpr }}"
          echo "master-public-b64=$(base64 -w0 < "master.pub.asc")"
          echo "master-public-file=master.pub.asc"
        } >> "$GITHUB_OUTPUT"

name: 'Sign RPM Package'
author: 'OpenCHAMI'
branding:
  icon: 'package'
  color: 'blue'
description: 'Signs an RPM using the provided GPG key fingerprint (expects GNUPGHOME from previous step)'

inputs:
  gpg-fingerprint:
    description: 'Fingerprint of the GPG key to use for signing'
    required: true
  gnupg-home:
    description: 'GNUPGHOME directory (optional). If not provided, current default will be used.'
    required: false
  resign:
    description: 'If true, addsign even if already signed.'
    default: 'false'

outputs:
  verification:
    description: 'Result of rpm --checksig'
    value: ${{ steps.verify.outputs.result }}

runs:
  using: composite
  steps:
    - name: Install RPM tools
      shell: bash
      run: |
        set -euo pipefail
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update -y
          apt-get install -y --no-install-recommends rpm gnupg
        elif command -v dnf >/dev/null 2>&1; then
          dnf install -y rpm-build rpm-sign gnupg
        fi

    - name: Configure RPM to use GPG key
      shell: bash
      env:
        GNUPGHOME: ${{ inputs['gnupg-home'] }}
        GPG_FINGERPRINT: ${{ inputs['gpg-fingerprint'] }}
      run: |
        set -euo pipefail
        GPG_BIN="$(command -v gpg || command -v gpg2)"
        {
          echo "%_signature gpg"
          echo "%_gpg_name $GPG_FINGERPRINT"
          echo "%__gpg $GPG_BIN"
          echo "%_gpg_digest_algo sha256"
        } >> "$HOME/.rpmmacros"
        echo "Using gpg at: $GPG_BIN"
        rpm --eval "%{__gpg}" || true

    - name: Sign the RPM
      shell: bash
      env:
        GNUPGHOME: ${{ inputs['gnupg-home'] }}
        GPG_FINGERPRINT: ${{ inputs['gpg-fingerprint'] }}
        RESIGN: ${{ inputs.resign }}
      run: |
        set -euo pipefail
        echo "GNUPGHOME=$GNUPGHOME"
        gpg --list-secret-keys || { echo "No secret keys in GNUPGHOME"; exit 1; }

        found=0
        while IFS= read -r f; do
          found=1
          if rpm --checksig "$f" 2>/dev/null | grep -qi 'pgp signature'; then
            if [ "$RESIGN" = "true" ]; then
              rpm --delsign "$f" || true
            else
              echo "Already signed; skipping $f (set resign=true to force)."
              continue
            fi
          fi
          # Use rpmsign (more reliable) with explicit defines
          rpmsign --addsign \
            --define "_signature gpg" \
            --define "_gpg_name $GPG_FINGERPRINT" \
            --define "__gpg $(command -v gpg)" \
            --define "_gpg_digest_algo sha256" \
            "$f"
        done < <(find . -type f -name '*.rpm')
        if [ "$found" -eq 0 ]; then
          echo "::error::no RPMs found under $(pwd)"; exit 1
        fi

    - name: Import Signer Public Key for Verification
      shell: bash
      env:
        GNUPGHOME: ${{ inputs['gnupg-home'] }}
        GPG_FINGERPRINT: ${{ inputs['gpg-fingerprint'] }}
      run: |
        set -euo pipefail
        gpg --armor --export "$GPG_FINGERPRINT" > signer.pub
        test -s signer.pub || { echo "Export produced no key for $GPG_FINGERPRINT"; exit 1; }
        rpm --import signer.pub || sudo rpm --import signer.pub
        rm -f signer.pub

    - name: Verify RPM signature
      id: verify
      shell: bash
      run: |
        set -euo pipefail

        RPMS=()
        while IFS= read -r f; do
          RPMS+=("$f")
        done < <(find . -type f -name '*.rpm')
        if [ "${#RPMS[@]}" -eq 0 ]; then
          echo "::error::no RPMs found under $(pwd)"; exit 1
        fi

        out=$(rpm --checksig "${RPMS[@]}")
        echo "$out"
        {
          echo "result<<EOF"
          echo "$out"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

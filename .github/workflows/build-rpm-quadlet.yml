# ############################################################################
# #  DEPRECATED WORKFLOW -- DO NOT USE IN NEW CALLERS
# #
# #  build-rpm-quadlet is replaced by nfpm packages in build-release-goreleaser.yml / build-check-goreleaser.yml.
# #  It is kept only so callers pinned to older refs keep working, and will be
# #  removed in a future major release. See README.md for migration notes.
# ############################################################################
#
# Reusable workflow: builds the caller repo's podman quadlet RPM and
# uploads it as an unsigned artifact for downstream signing.

name: build-rpm-quadlet
on:
  workflow_call:
    inputs:
      artifact-name-unsigned-rpms:
        description: 'Artifact-name for unsigned RPM artifacts'
        default: 'rpms-unsigned'
        type: string

permissions:
  contents: read   # baseline for checkout

jobs:
  rpm-build:
    runs-on: ubuntu-latest
    container:
      image: rockylinux:9
    steps:
      - name: Deprecation warning
        run: |
          echo "::warning title=Deprecated workflow::build-rpm-quadlet.yml is deprecated; migrate to nfpm packages in build-release-goreleaser.yml / build-check-goreleaser.yml."
      - name: Install build dependencies
        run: dnf install -y -q git make rpm-build rpmlint

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Build RPM
        run: make rpm-build

      - name: Upload RPM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name-unsigned-rpms }}
          path: '**/*.rpm'

name: lint-go

# Reusable workflow that lints the caller's Go module. Runs golangci-lint,
# and separately verifies go.mod/go.sum are tidy by running the tidy
# command and failing on a dirty diff.
#
# Pair with test-unit-go for the unit-test half of the Go CI wave.

on:
  workflow_call:
    inputs:
      go-version:
        description: 'Go version to use (e.g. "1.26.7", "stable"). Mutually exclusive with go-version-file.'
        required: false
        type: string
      go-version-file:
        description: 'Path to a go.mod or .go-version file containing the Go version. Mutually exclusive with go-version.'
        required: false
        type: string
      golangci-lint-version:
        description: 'golangci-lint release to run'
        required: false
        type: string
        default: 'latest'

permissions:
  contents: read   # baseline for checkout

jobs:
  golangci-lint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version || (inputs.go-version-file == '' && 'stable' || '') }}
          go-version-file: ${{ inputs.go-version-file || '' }}
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ inputs.golangci-lint-version }}

  modules:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version || (inputs.go-version-file == '' && 'stable' || '') }}
          go-version-file: ${{ inputs.go-version-file || '' }}
      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

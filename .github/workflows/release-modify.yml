name: release-modify

# Reusable workflow: edits the draft GitHub Release for the triggering tag
# before publish-release makes it public. Appends to or replaces the release
# notes, and adds or replaces release files from an artifact. Knows nothing
# about what it attaches (e.g. gpg-sign-artifacts' signatures and its
# `release-notes` output).
#
# Fails when the target release is not a draft: a release went public before
# this step ran (e.g. before its signatures were attached).

on:
  workflow_call:
    inputs:
      notes:
        description: 'Markdown for the release notes (empty leaves them unchanged)'
        required: false
        type: string
        default: ''
      notes-mode:
        description: 'append (after the existing notes) or replace'
        required: false
        type: string
        default: 'append'
      files-artifact-name:
        description: 'Artifact whose files are attached to the release (empty attaches nothing)'
        required: false
        type: string
        default: ''
      files-mode:
        description: 'add (fail if a release file already has the name) or replace (overwrite same-named release files)'
        required: false
        type: string
        default: 'add'

permissions:
  contents: write   # edit the draft GitHub Release and upload files

jobs:
  release-modify:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check inputs and verify draft state
        env:
          NOTES_MODE: ${{ inputs.notes-mode }}
          FILES_MODE: ${{ inputs.files-mode }}
        run: |
          set -euo pipefail
          failed=false
          [[ "$NOTES_MODE" == append || "$NOTES_MODE" == replace ]] \
            || { echo "::error::notes-mode must be append or replace; got '${NOTES_MODE}'"; failed=true; }
          [[ "$FILES_MODE" == add || "$FILES_MODE" == replace ]] \
            || { echo "::error::files-mode must be add or replace; got '${FILES_MODE}'"; failed=true; }
          if ! draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
            echo "::error::No release for ${TAG}."
            failed=true
          elif [[ "$draft" != true ]]; then
            echo "::error::Release ${TAG} is already published; release-modify only edits drafts."
            failed=true
          fi
          [[ "$failed" == false ]] || exit 1

      - name: Update release notes
        if: ${{ inputs.notes != '' }}
        env:
          NOTES: ${{ inputs.notes }}
          NOTES_MODE: ${{ inputs.notes-mode }}
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/notes.md"
          release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId,body)
          if [[ "$NOTES_MODE" == append ]]; then
            jq -j '.body // ""' <<< "$release" > "$body"
            [[ -s "$body" ]] && printf '\n\n' >> "$body"
          else
            : > "$body"
          fi
          printf '%s\n' "$NOTES" >> "$body"
          gh api --method PATCH --silent \
            "repos/${GITHUB_REPOSITORY}/releases/$(jq -r .databaseId <<< "$release")" \
            -F "body=@${body}"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.files-artifact-name != '' }}
        with:
          name: ${{ inputs.files-artifact-name }}
          path: ${{ runner.temp }}/release-files

      - name: Upload release files
        if: ${{ inputs.files-artifact-name != '' }}
        env:
          FILES_MODE: ${{ inputs.files-mode }}
          FILES_DIR: ${{ runner.temp }}/release-files
        run: |
          set -euo pipefail
          mapfile -t files < <(find "$FILES_DIR" -type f | sort)
          (( ${#files[@]} )) || { echo "::error::The artifact has no files."; exit 1; }
          # Release files are flat: report every name clash before failing.
          failed=false
          dupes=$(printf '%s\n' "${files[@]##*/}" | sort | uniq -d)
          for name in $dupes; do
            echo "::error::Several artifact files are named ${name}."
            failed=true
          done
          if [[ "$FILES_MODE" == add ]]; then
            existing=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            for f in "${files[@]}"; do
              if grep -qxF "${f##*/}" <<< "$existing"; then
                echo "::error::Release ${TAG} already has ${f##*/}; use files-mode: replace to overwrite."
                failed=true
              fi
            done
          fi
          [[ "$failed" == false ]] || exit 1
          clobber=()
          [[ "$FILES_MODE" == replace ]] && clobber=(--clobber)
          gh release upload "$TAG" "${files[@]}" "${clobber[@]}" --repo "$GITHUB_REPOSITORY"
          printf 'Attached %s\n' "${files[@]##*/}"

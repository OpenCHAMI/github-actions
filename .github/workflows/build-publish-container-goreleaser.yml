#
# Reusable workflow: builds and publishes a container image via GoReleaser,
# with multi-arch builds, build provenance attestation, and PR snapshot
# support.

name: Build and publish container using goreleaser
on:
  workflow_call:
    inputs:
      cgo_enabled:
        type: number
        required: false
        default: 0
      go_version:
        type: string
        required: false
        description: 'Go version to use (e.g. "1.26.7", "stable"). Mutually exclusive with go_version_file.'
      go_version_file:
        type: string
        required: false
        description: 'Path to a go.mod or .go-version file containing the Go version. Mutually exclusive with go_version.'
      is_pr_build:
        type: boolean
        required: false
        default: false
      pr_number:
        type: number
        required: false
        default: ${{ github.event.number || 0 }}
      registry_subject_name:
        type: string
        required: true
jobs:
  container_build_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ inputs.go_version || 'stable' }}
          go-version-file: ${{ inputs.go_version_file || '' }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:master
            network=host
      - name: Check if fork PR
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && \
                "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            echo "SKIP_CONTAINER_PUBLISH=true" >> "${GITHUB_ENV}"
            echo "::warning title=Fork PR - Container Publish Skipped::Containers will be built but not published for fork PRs due to GitHub security restrictions."
          else
            echo "SKIP_CONTAINER_PUBLISH=false" >> "${GITHUB_ENV}"
          fi
      - name: Docker Login
        if: env.SKIP_CONTAINER_PUBLISH == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-tags: true
          fetch-depth: 0
      # Set environment variables required by GoReleaser
      - name: Set build environment variables
        run: |
          {
            GIT_STATE='dirty'
            if git diff-index --quiet HEAD -- >/dev/null 2>&1; then
              GIT_STATE='clean'
            fi

            echo "GIT_STATE=${GIT_STATE}"
            echo "BUILD_HOST=$(hostname)"
            echo "GO_VERSION=$(go version | awk '{print $3}')"
            echo "BUILD_USER=$(whoami)"
            echo "CGO_ENABLED=${{ inputs.cgo_enabled }}"
            echo "IS_PR_BUILD=${{ inputs.is_pr_build }}"
          } >> "${GITHUB_ENV}"
      - name: Create Tag for PR
        if: ${{ inputs.is_pr_build }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f -a pr-${{ inputs.pr_number }} -m "PR Release"
      - name: Build/Push/Release container with goreleaser
        uses: goreleaser/goreleaser-action@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: '~> 2'
          args: release --clean ${{ inputs.is_pr_build && '--skip=announce,validate,archive' || '' }}${{ env.SKIP_CONTAINER_PUBLISH == 'true' && (inputs.is_pr_build && ',publish' || '--skip=publish') || '' }}
        id: goreleaser
      - name: Process goreleaser output
        if: env.SKIP_CONTAINER_PUBLISH == 'false'
        id: process_goreleaser_output
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const artifacts = ${{ steps.goreleaser.outputs.artifacts }};
          const firstNonNullDigest = artifacts.find(artifact => artifact.extra && artifact.extra.Digest != null)?.extra.Digest;
          console.log(firstNonNullDigest);
          fs.writeFileSync('digest.txt', firstNonNullDigest);
          EOF
          echo "digest=$(cat digest.txt)" >> "${GITHUB_OUTPUT}"
      - name: Attest Binaries
        if: ${{ (env.SKIP_CONTAINER_PUBLISH == 'false') && (inputs.is_pr_build == false) }}
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-path: dist/**
      - name: generate build provenance
        if: ${{ (env.SKIP_CONTAINER_PUBLISH == 'false') && (inputs.is_pr_build == false) }}
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-name: ${{ inputs.registry_subject_name }}
          subject-digest: ${{ steps.process_goreleaser_output.outputs.digest }}
          push-to-registry: true

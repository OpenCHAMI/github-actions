#
# Reusable workflow: builds and publishes a container image via GoReleaser,
# with multi-arch builds, build provenance attestation, and PR snapshot
# support.

name: build-publish-container-goreleaser
on:
  workflow_call:
    inputs:
      build-deps:
        type: string
        required: false
        description: 'Space-separated list of apt packages to install before building (e.g. "gcc-aarch64-linux-gnu libc6-dev-arm64-cross").'
      cgo-enabled:
        type: number
        required: false
        default: 0
      go-version:
        type: string
        required: false
        description: 'Go version to use (e.g. "1.26.7", "stable"). Mutually exclusive with go-version-file.'
      go-version-file:
        type: string
        required: false
        description: 'Path to a go.mod or .go-version file containing the Go version. Mutually exclusive with go-version.'
      release-draft:
        type: boolean
        required: false
        default: false
        description: 'Create the release as a draft, overriding release.draft in .goreleaser.yml'
      is-pr-build:
        type: boolean
        required: false
        default: false
      pr-number:
        type: number
        required: false
        default: ${{ github.event.number || 0 }}
      registry-subject-name:
        type: string
        required: true

permissions:
  contents: write      # release creation, uploading assets
  packages: write      # docker login, image push, upload container provenance
  id-token: write      # Sigstore signing (attest-build-provenance)
  attestations: write  # write build provenance attestations

jobs:
  container-build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Deprecation warning
        run: |
          echo "::warning title=Deprecated workflow::build-publish-container-goreleaser.yml is deprecated; migrate to build-release-goreleaser.yml (build-only: build-check-goreleaser.yml)."
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-tags: true
          fetch-depth: 0
      - name: Install build dependencies
        if: ${{ inputs.build-deps != '' }}
        env:
          BUILD_DEPS: ${{ inputs.build-deps }}
        run: |
          sudo apt update
          # shellcheck disable=SC2086 # intentional word splitting
          sudo apt install -y --no-install-recommends ${BUILD_DEPS}
      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ inputs.go-version || (inputs.go-version-file == '' && 'stable' || '') }}
          go-version-file: ${{ inputs.go-version-file || '' }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:master
            network=host
      - name: Check if fork PR
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && \
                "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            echo "SKIP_CONTAINER_PUBLISH=true" >> "${GITHUB_ENV}"
            echo "::warning title=Fork PR - Container Publish Skipped::Containers will be built but not published for fork PRs due to GitHub security restrictions."
          else
            echo "SKIP_CONTAINER_PUBLISH=false" >> "${GITHUB_ENV}"
          fi
      - name: Docker Login
        if: env.SKIP_CONTAINER_PUBLISH == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Set environment variables required by GoReleaser
      - name: Set build environment variables
        run: |
          {
            GIT_STATE='dirty'
            if git diff-index --quiet HEAD -- >/dev/null 2>&1; then
              GIT_STATE='clean'
            fi

            echo "GIT_STATE=${GIT_STATE}"
            echo "BUILD_HOST=$(hostname)"
            echo "GO_VERSION=$(go version | awk '{print $3}')"
            echo "BUILD_USER=$(whoami)"
            echo "CGO_ENABLED=${{ inputs.cgo-enabled }}"
            echo "IS_PR_BUILD=${{ inputs.is-pr-build }}"
          } >> "${GITHUB_ENV}"
      - name: Create Tag for PR
        if: ${{ inputs.is-pr-build }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f -a pr-${{ inputs.pr-number }} -m "PR Release"
      - name: Generate release notes
        if: ${{ !inputs.is-pr-build }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -F tag_name="${{ github.ref_name }}" --jq .body > ../notes.md
      - name: Build/Push/Release container with goreleaser
        uses: goreleaser/goreleaser-action@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: '~> 2'
          args: release --clean ${{ inputs.is-pr-build && '--skip=announce,validate,archive' || '' }}${{ env.SKIP_CONTAINER_PUBLISH == 'true' && (inputs.is-pr-build && ',publish' || '--skip=publish') || '' }} ${{ inputs.release-draft && '--draft' || '' }} ${{ !inputs.is-pr-build && '--release-notes ../notes.md' || '' }}
        id: goreleaser
      - name: Process goreleaser output
        if: env.SKIP_CONTAINER_PUBLISH == 'false'
        id: process-goreleaser-output
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const artifacts = ${{ steps.goreleaser.outputs.artifacts }};
          const firstNonNullDigest = artifacts.find(artifact => artifact.extra && artifact.extra.Digest != null)?.extra.Digest;
          console.log(firstNonNullDigest);
          if (firstNonNullDigest) {
            fs.writeFileSync('digest.txt', firstNonNullDigest);
          } else {
            console.error('No digest found in artifacts');
            process.exit(1);
          }
          EOF
          if [ -f digest.txt ]; then
            echo "digest=$(cat digest.txt)" >> "${GITHUB_OUTPUT}"
          fi
      - name: Attest Binaries
        if: ${{ (env.SKIP_CONTAINER_PUBLISH == 'false') && (inputs.is-pr-build == false) }}
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-path: dist/**
      - name: generate build provenance
        if: ${{ (env.SKIP_CONTAINER_PUBLISH == 'false') && (inputs.is-pr-build == false) }}
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-name: ${{ inputs.registry-subject-name }}
          subject-digest: ${{ steps.process-goreleaser-output.outputs.digest }}
          push-to-registry: true

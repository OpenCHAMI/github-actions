#
# Reusable workflow: publishes the draft GitHub Release for a tag once every
# upstream job has finished attaching its artifacts.
name: publish-release
permissions:
  contents: write   # publish the draft GitHub Release
on:
  workflow_call:
    inputs:
      make-latest:
        description: 'Mark the published release as the latest release. Use "legacy" to defer to GitHub'
        type: string
        default: 'true'
        required: false
      draft:
        description: 'Leave the release in draft state'
        type: boolean
        default: false
        required: false
jobs:
  publish-release:
    runs-on: ubuntu-slim
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DRAFT: ${{ inputs.draft }}
          MAKE_LATEST: ${{ inputs.make-latest }}
        run: |
          latest=()
          [[ "$MAKE_LATEST" != legacy ]] && latest=(--latest="$MAKE_LATEST")
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft="$DRAFT" "${latest[@]}"

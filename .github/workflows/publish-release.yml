#
# Reusable workflow: publishes the draft GitHub Release for a tag once every
# upstream job has finished attaching its artifacts. Fails if the release is
# already published, since it then went public before those jobs finished.
name: publish-release
permissions:
  contents: write   # publish the draft GitHub Release
on:
  workflow_call:
    inputs:
      make-latest:
        description: 'Mark the published release as the latest release: true, false, or legacy (GitHub picks by date and semver)'
        type: string
        # see this comment for details:
        # https://github.com/OpenCHAMI/github-actions/pull/38#discussion_r4213262488
        default: 'legacy'
        required: false
      draft:
        description: 'Leave the release in draft state'
        type: boolean
        default: false
        required: false
jobs:
  publish-release:
    runs-on: ubuntu-slim
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DRAFT: ${{ inputs.draft }}
          MAKE_LATEST: ${{ inputs.make-latest }}
        run: |
          set -euo pipefail
          release=$(gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,isDraft)

          # A published release went public before every upstream job (e.g.
          # signing) had attached its files.
          if [[ $(jq -r .isDraft <<< "$release") != true ]]; then
            echo "::error::Release ${TAG} is already published; it should still be a draft until publish-release runs."
            exit 1
          fi
          release_id=$(jq -r .databaseId <<< "$release")

          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F "draft=$DRAFT" \
            -f "make_latest=$MAKE_LATEST"

#
# Reusable workflow: publishes the draft GitHub Release for a tag once every
# upstream job has finished attaching its artifacts.
name: publish-release
permissions:
  contents: write   # publish the draft GitHub Release
on:
  workflow_call:
    inputs:
      make-latest:
        description: 'Mark the published release as the latest release. Use "legacy" to defer to GitHub'
        type: string
        default: 'true'
        required: false
jobs:
  publish-release:
    runs-on: ubuntu-slim
    steps:
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          make_latest: ${{ inputs.make-latest }}

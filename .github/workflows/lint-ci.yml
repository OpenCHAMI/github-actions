name: lint-ci

# Reusable workflow that lints GitHub Actions workflow files in the caller repo.
# Runs actionlint (syntax / shellcheck / action-version sanity) and zizmor
# (security-focused static analysis with SARIF upload to GHAS).

on:
  workflow_call:

permissions:
  contents: read   # baseline for checkout

jobs:
  actionlint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          flags: -color

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read          # baseline for checkout
      security-events: write  # for SARIF upload to GHAS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4

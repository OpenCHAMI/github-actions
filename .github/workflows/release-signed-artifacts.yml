# #  DEPRECATED WORKFLOW -- DO NOT USE IN NEW CALLERS
# #
# #  release-signed-artifacts is replaced by the GoReleaser release created by build-release-goreleaser.yml.
# #  It is kept only so callers pinned to older refs keep working, and will be
# #  removed in a future major release. See README.md for migration notes.
# ############################################################################
#
# Reusable workflow: publishes a GitHub Release for a tag, attaching signed
# RPMs and public keys, with trust-chain verification instructions in the
# release body.
name: release-signed-artifacts
permissions:
  contents: write   # create GitHub Release and upload artifacts
on:
  workflow_call:
    inputs:
      artifact-name-signed-rpms:
        description: 'Name for the signed RPM composite artifact'
        type: string
        default: 'rpms-signed'
        required: false
      artifact-name-public-keys:
        description: 'Name for the public key composite artifact'
        type: string
        default: 'public-keys'
        required: false
      append-body:
        description: 'Append the verification instructions to the existing release body instead of replacing it'
        type: boolean
        default: true
        required: false
      release-draft:
        description: 'Leave the release in draft state'
        type: boolean
        default: false
        required: false
      release-name:
        description: 'Release title. When empty, the existing release name is kept'
        type: string
        default: ''
        required: false
jobs:
  artifacts-release:
    runs-on: ubuntu-slim
    steps:
      - name: Deprecation warning
        run: |
          echo "::warning title=Deprecated workflow::release-signed-artifacts.yml is deprecated; migrate to the GoReleaser release created by build-release-goreleaser.yml."
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-tags: true
          fetch-depth: 0
      - name: Download signed RPM artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name-signed-rpms }}
          path: dist/rpms
      - name: Download public key artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name-public-keys }}
          path: dist/keys
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ inputs.release-name }}
          draft: ${{ inputs.release-draft }}
          append_body: ${{ inputs.append-body }}
          fail_on_unmatched_files: true
          files: |
            dist/rpms/**/*.rpm
            dist/keys/**/*.asc
          body: |-
            ## GPG Signature Verification

            Each RPM in this release is signed with a short-lived ephemeral key that
            is certified by the repository signing key, which is itself certified by
            the OpenCHAMI offline master key.

            ### Trust chain

            ```
            offline master key
                └─[certifies]─> repo key
                                    └─[certifies]─> ephemeral key (${{ github.ref_name }})
                                                        └─[signs]─> RPM files
            ```

            ### How to verify

            1. Download `repo-cert.pub.asc` and `ephemeral.pub.asc` from this release.
            2. Import both keys:
               ```bash
               gpg --import repo-public.asc ephemeral-public.asc
               ```
            3. Verify each RPM:
               ```bash
               rpm --checksig *.rpm
               ```
            4. For full chain verification (requires the master public key):
               ```bash
               curl -LO \
                 https://raw.githubusercontent.com/OpenCHAMI/gpg-signing-manager/main/scripts/verify-chain.sh
               bash verify-chain.sh \
                 --master    master.pub.asc \
                 --repo      repo-cert.pub.asc \
                 --ephemeral ephemeral.pub.asc \
                 --rpm       *.rpm
               ```

name: validate-packages

# Reusable workflow that validates the rpm/deb packages produced by
# build-check-goreleaser or build-release-goreleaser (their dist artifact).
# For each package it checks, inside a matching distro container:
#
# - the file list is exactly what the caller expects (regular files and
#   symlinks only: dpkg owns parent directories implicitly, and rpm matches so
#   one spec covers both)
# - the rpm signature verifies against the gpg-public-key.asc that
#   build-release-goreleaser puts in the artifact when it signs (skipped when
#   absent, e.g. PR/check builds or no gpg-key)
# - the package installs (`dnf install` / `apt-get install`), which resolves
#   dependencies and runs scriptlets, and every expected path exists afterward
# - rpmlint / lintian, report-only

on:
  workflow_call:
    inputs:
      packages:
        description: 'YAML list of package specs, each with a `name` glob, a `files` list, and optional `rpm-files`/`deb-files` extras; every matching .rpm/.deb is validated'
        required: true
        type: string
      dist-artifact-name:
        description: 'Artifact holding the packages (from build-check-goreleaser / build-release-goreleaser)'
        required: false
        type: string
        default: 'goreleaser-dist'
      rpm-image:
        description: 'Container image used to validate .rpm packages'
        required: false
        type: string
        default: 'docker.io/library/rockylinux:9@sha256:d7be1c094cc5845ee815d4632fe377514ee6ebcf8efaed6892889657e5ddaaa6'
      deb-image:
        description: 'Container image used to validate .deb packages'
        required: false
        type: string
        default: 'docker.io/library/debian:13@sha256:913f6706df59a68922d1dd08f78c2476560a8d367897200a6005b00e5f67c2d5'
      lint:
        description: 'Run rpmlint / lintian (report-only)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read   # baseline for checkout

jobs:
  parse:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.dist-artifact-name }}
          path: dist

      - name: Parse package specs
        id: parse
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          # One matrix entry per file matching each spec's glob. The arch is
          # read from the package header and picks a runner that can install it.
          entries="${RUNNER_TEMP}/matrix.jsonl"
          touch "$entries"
          while IFS= read -r spec; do
            glob=$(jq -r '.name' <<< "$spec")
            mapfile -d '' pkgs < <(find dist -type f -name "$glob" \( -name '*.rpm' -o -name '*.deb' \) -print0 | sort -z)
            if (( ${#pkgs[@]} == 0 )); then
              echo "::error::no package in dist matches ${glob}"
              exit 1
            fi
            for pkg in "${pkgs[@]}"; do
              format=${pkg##*.}
              if [[ "$format" == rpm ]]; then
                arch=$(rpm -qp --nosignature --qf '%{ARCH}' "$pkg")
              else
                arch=$(dpkg-deb -f "$pkg" Architecture)
              fi
              case "$arch" in
                x86_64|amd64|noarch|all) runner=ubuntu-latest ;;
                aarch64|arm64) runner=ubuntu-24.04-arm ;;
                *) echo "::error::unsupported architecture ${arch}: ${pkg}"; exit 1 ;;
              esac
              jq -c --arg path "$pkg" --arg file "${pkg##*/}" --arg format "$format" \
                --arg runner "$runner" \
                '. + {path: $path, file: $file, format: $format, runner: $runner,
                      files: ((.files // []) + (.["\($format)-files"] // []))}' \
                <<< "$spec" >> "$entries"
            done
          done < <(yq -o=json -I=0 '.[]' <<< "$PACKAGES")
          matrix=$(jq -sc '.' "$entries")
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  validate:
    needs: parse
    name: validate (${{ matrix.package.file }})
    runs-on: ${{ matrix.package.runner }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.parse.outputs.matrix) }}
    container:
      image: ${{ matrix.package.format == 'rpm' && inputs.rpm-image || inputs.deb-image }}  # zizmor: ignore[unpinned-images] defaults are digest-pinned; overrides are the caller's
    defaults:
      run:
        shell: bash
    env:
      PKG: ${{ matrix.package.path }}
      PKG_FORMAT: ${{ matrix.package.format }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.dist-artifact-name }}
          path: dist

      - name: Install tools
        run: |
          set -euo pipefail
          if [[ "$PKG_FORMAT" == rpm ]]; then
            dnf install -y -q jq diffutils
          else
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq jq
          fi

      - name: Verify file list is exactly what's expected
        env:
          FILES: ${{ toJSON(matrix.package.files) }}
        run: |
          set -euo pipefail
          if [[ "$PKG_FORMAT" == rpm ]]; then
            rpm -qp --nosignature --qf '[%{FILEMODES:perms} %{FILENAMES}\n]' "$PKG" | sed -n 's/^[^d][^ ]* //p' | sort > /tmp/actual-files.txt
          else
            dpkg-deb --fsys-tarfile "$PKG" | tar -t | sed 's|^\./|/|' | grep -v '/$' | sort | grep -v '^$' > /tmp/actual-files.txt
          fi
          jq -r '.[]' <<< "$FILES" | sort | grep -v '^$' > /tmp/expected-files.txt
          diff /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Verify signature
        run: |
          set -euo pipefail
          key=dist/gpg-public-key.asc
          if [[ ! -f "$key" ]]; then
            echo "::notice::no gpg-public-key.asc in the artifact (unsigned build); signature not checked"
            exit 0
          fi
          if [[ "$PKG_FORMAT" != rpm ]]; then
            echo "::notice::deb packages are not signature-checked"
            exit 0
          fi
          rpm --import "$key"
          out=$(rpm -K "$PKG")
          echo "$out"
          grep -q 'signatures OK' <<< "$out"

      - name: Install package
        run: |
          set -euo pipefail
          if [[ "$PKG_FORMAT" == rpm ]]; then
            dnf install -y "./${PKG}"
          else
            DEBIAN_FRONTEND=noninteractive apt-get install -y "./${PKG}"
          fi
          # Every expected path must exist after install (catches e.g. dangling
          # symlinks packaged in place of files).
          missing=0
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            if [[ ! -e "$f" ]]; then
              echo "::error::installed path missing or dangling: ${f}"
              missing=1
            fi
          done < /tmp/expected-files.txt
          exit "$missing"

      - name: Lint package (report-only)
        if: ${{ inputs.lint }}
        continue-on-error: true
        run: |
          set -uo pipefail
          if [[ "$PKG_FORMAT" == rpm ]]; then
            dnf install -y -q epel-release && dnf install -y -q rpmlint
            rpmlint "$PKG"
          else
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq lintian
            lintian "$PKG"
          fi

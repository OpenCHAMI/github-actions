#
# Reusable workflow: deletes the GHCR container image versions a pull request
# published, once that pull request closes. Call it from a `pull_request`
# `closed` trigger; the PR number comes from the event. GITHUB_TOKEN can't list
# packages, so image names come from `images`, else the ghcr.io entries in the
# GoReleaser config (`dockers_v2[].images`), else the repository name (see
# actions/discover-ghcr-images).

name: pr-registry-cleanup
on:
  workflow_call:
    inputs:
      images:
        description: 'Space- or newline-separated GHCR package names to clean up (default: from the GoReleaser config, else the repository name)'
        required: false
        type: string
        default: ''

permissions:
  contents: read    # checkout, to read the GoReleaser config
  packages: write   # delete container image versions from GHCR

jobs:
  discover:
    # Fork PRs publish nothing (and get a read-only token). Other events run
    # so the trigger check can fail them.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - name: Check trigger
        if: ${{ github.event_name != 'pull_request' }}
        env:
          EVENT: ${{ github.event_name }}
        run: |
          echo "::error::pr-registry-cleanup runs on pull_request (closed); got ${EVENT}"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Discover images
        id: discover
        uses: OpenCHAMI/github-actions/actions/discover-ghcr-images@1bcb6a89c847927a24c6abcde3b88df4d61f79a0 # v4.0
        with:
          images: ${{ inputs.images }}

      - name: List packages for the matrix
        id: packages
        env:
          NAMES: ${{ steps.discover.outputs.names }}
        run: echo "packages=$(jq -cn --arg names "$NAMES" '$names | split(" ")')" >> "$GITHUB_OUTPUT"

  cleanup:
    needs: discover
    runs-on: ubuntu-slim
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - name: Delete PR container image versions
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ matrix.package }}
          # PR builds are tagged pr-<N> by build-release-goreleaser.
          BASE_TAG: pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Nested package names (tools/foo) need their slash encoded.
          encoded=$(jq -rn --arg name "$PACKAGE" '$name | @uri')
          # A version is ours when one of its tags is the base tag itself or the
          # base tag plus a separated qualifier (pr-12, pr-12-arm64,
          # pr-12-dirty-abc123). Requiring the separator keeps a cleanup of
          # pr-12 away from pr-123.
          versions=$(gh api --paginate "/orgs/${OWNER}/packages/container/${encoded}/versions" \
            | jq -r --arg base "${BASE_TAG}" '
                .[]
                | select(
                    (.metadata.container.tags // [])
                    | any(
                        . == $base
                        or (startswith($base) and (.[($base | length):] | test("^[-._]")))
                      )
                  )
                | .id
              ') || { echo "::error::Can't read versions of ghcr.io package '${PACKAGE}'."; exit 1; }

          if [[ -z "${versions}" ]]; then
            echo "No versions tagged ${BASE_TAG}*"
            exit 0
          fi

          failed=false
          while read -r version_id; do
            echo "Deleting version ${version_id}"
            if ! gh api --method DELETE "/orgs/${OWNER}/packages/container/${encoded}/versions/${version_id}"; then
              echo "::error::Can't delete version ${version_id} of ghcr.io package '${PACKAGE}'."
              failed=true
            fi
          done <<< "${versions}"
          [[ "$failed" == false ]] || exit 1
          echo "Cleanup completed for ${BASE_TAG}"
